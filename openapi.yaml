openapi: 3.0.0
info:
  title: PWOP API
  version: 0.1.0
  description: API pour l'application mobile PWOP et l'espace admin
servers:
  - url: https://api.example.com
paths:
  /auth/register:
    post:
      summary: Inscription d'un client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Utilisateur créé
  /auth/login:
    post:
      summary: Connexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token JWT
  /collection_requests:
    post:
      summary: Créer une demande de collecte
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                description:
                  type: string
                waste_type:
                  type: string
                scheduled_for:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Demande créée
    get:
      summary: Lister les demandes (admin/employee peuvent voir toutes)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des demandes
  /payments:
    get:
      summary: Lister les paiements pour l'utilisateur
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des paiements
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
